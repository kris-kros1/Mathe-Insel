<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#256756"><title>Mathe-Insel · Ein kleiner Schritt nach dem anderen</title>
<style>
:root{--ink:#243f38;--green:#256756;--soft:#edf3ea;--paper:#fffefa;--line:#dce4d9;--muted:#64766c;--sun:#f5cf6c}*{box-sizing:border-box}body{margin:0;background:#f5f5ed;color:var(--ink);font:18px/1.5 system-ui,-apple-system,sans-serif}button,select,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:12px 20px;color:var(--ink);min-height:48px}button:hover{border-color:var(--green);background:#eef4eb}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #c77d2c;outline-offset:4px}button:disabled{cursor:default;opacity:.55}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#194e40;color:white}.quiet{background:transparent}header{max-width:1100px;margin:auto;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:23px;display:flex;align-items:center;gap:12px}.logo{background:var(--green);color:#f7df8e;width:43px;height:43px;border-radius:15px;display:grid;place-items:center;font-size:28px}main{max-width:1040px;margin:16px auto 60px;padding:0 26px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}h1{font-size:clamp(32px,5vw,52px);line-height:1.15;letter-spacing:-.035em;margin:12px 0 18px}h2{font-size:28px;line-height:1.25;margin:10px 0}p{margin:12px 0}.muted{color:var(--muted)}.hero{background:#e6eddf;border-radius:28px;padding:36px 40px;display:grid;grid-template-columns:1fr 200px;gap:20px;align-items:center}.hero p{max-width:530px}.island{width:180px;height:180px;border-radius:50%;background:#d2e1c5;position:relative;display:grid;place-items:center}.island span{font-size:75px;transform:rotate(-8deg)}.island:after{content:'1  ·  2  ·  3';position:absolute;bottom:17px;font-weight:800;color:#43664c}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.section-title{margin:30px 0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.station{text-align:left;padding:23px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-height:200px;border-radius:22px}.station strong{font-size:21px}.station small{font-size:15px;color:var(--muted)}.badge{font-size:14px;color:var(--green);background:var(--soft);border-radius:8px;padding:4px 10px}.foot{font-size:14px;color:var(--muted);margin-top:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:30px;max-width:780px;margin:20px auto}.exercise{text-align:center}.steps{display:flex;justify-content:center;gap:22px;font-size:15px;color:var(--muted);margin:22px 0}.steps b{color:var(--green)}.progress{display:flex;gap:8px}.progress i{height:9px;width:34px;background:#dce4d9;border-radius:8px}.progress i.done{background:var(--green)}.equation{font-size:clamp(34px,7vw,56px);font-weight:750;letter-spacing:.02em;margin:20px 0}.answer{display:inline-block;width:100px;text-align:center;border:2px solid #9aafa0;border-radius:14px;padding:6px;background:white;color:var(--ink);font-weight:750;font-size:inherit}.keypad{max-width:330px;margin:18px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.keypad button{font-size:24px;padding:9px}.feedback{min-height:42px;font-weight:650;margin:10px auto;max-width:590px}.hint{background:#eef3e9;border-radius:18px;padding:18px;margin:16px auto;max-width:590px}.frames{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0}.ten{display:grid;grid-template-columns:repeat(5,20px);gap:5px;border:1px solid #bccbb9;padding:8px;border-radius:10px}.dot{width:20px;height:20px;border-radius:50%;background:#e1e7dc}.dot.a{background:var(--green)}.dot.b{background:#c59036}.dot.gone{background:#dfbfa5;position:relative}.dot.gone:after{content:'×';position:absolute;inset:-5px 0;font-weight:bold;color:#70452c}.hundred{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;max-width:330px;margin:12px auto}.rod{background:var(--green);color:white;border-radius:6px;padding:4px 8px;font-size:15px}.unit{background:#d6ac59;color:#302b20;border-radius:50%;width:28px;height:28px}.setting{padding:16px 0;border-bottom:1px solid var(--line)}select{padding:8px;border:1px solid var(--line);border-radius:9px;background:white;max-width:100%}.big-icon{font-size:55px}.hidden{display:none!important}details{margin-top:22px;text-align:left;font-size:15px}summary{cursor:pointer;font-weight:700}#screen:focus{outline:none}@media(max-width:700px){header{padding:18px}.brand{font-size:19px}main{padding:0 16px;margin-top:8px}.hero{padding:25px;grid-template-columns:1fr}.island{display:none}.grid{grid-template-columns:1fr 1fr}.station{padding:17px;min-height:175px}.station strong{font-size:18px}.panel{padding:20px 15px}.steps{gap:12px;font-size:13px}header button{font-size:14px;padding:10px}.equation{letter-spacing:0}.answer{width:82px}}@media(max-width:400px){.grid{grid-template-columns:1fr}.station{min-height:140px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header><div class="brand"><span class="logo" aria-hidden="true">≈</span>Mathe-Insel</div><button id="adult" class="quiet">Für Erwachsene</button></header><main id="screen" tabindex="-1"></main>
<script>
'use strict';
const $=s=>document.querySelector(s),screen=$('#screen');
const modules=[
 {name:'Zahlen zerlegen',sub:'Teile und Ganzes entdecken',range:'Bis 10',icon:'◒'},
 {name:'Plus & Minus',sub:'Sicher rechnen bis 20',range:'Ohne Zehnerübergang',icon:'＋'},
 {name:'Über die 10',sub:'In zwei kleinen Schritten',range:'Mit Zehnerübergang',icon:'↗'},
 {name:'Zehner & Einer',sub:'Große Zahlen verstehen',range:'Bis 100',icon:'▥'},
 {name:'Rechnen bis 100',sub:'Erst Zehner, dann Einer',range:'Ohne Zehnerübergang',icon:'＋'},
 {name:'Über den Zehner',sub:'Die nächste Rechenbrücke',range:'Bis 100',icon:'↗'}];
let data={rounds:Array(6).fill(0),length:5,mode:'mixed',voice:false},storage=true;
try{const d=JSON.parse(localStorage.getItem('matheinsel-v1'));if(d){if(Array.isArray(d.rounds)&&d.rounds.length===6)data.rounds=d.rounds.map(n=>Math.max(0,Number(n)||0));if([3,5,8].includes(d.length))data.length=d.length;if(['mixed','plus','minus'].includes(d.mode))data.mode=d.mode;data.voice=!!d.voice}}catch(e){storage=false}
let state=null,lastPage='home';
function save(){try{localStorage.setItem('matheinsel-v1',JSON.stringify(data))}catch(e){storage=false}}
function mount(html){screen.innerHTML=html;screen.focus();window.scrollTo(0,0)}
function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.85;window.speechSynthesis.speak(u)}
function home(){state=null;lastPage='home';mount(`<section class="hero"><div><div class="eyebrow">Deine kleine Lernpause · Klasse 1 → 2</div><h1>Kleine Schritte.<br>Große Mathefreude.</h1><p>Eine Aufgabe nach der anderen.<br>Du hast Zeit. Du darfst dir helfen lassen.</p><button class="primary" id="start">Los geht’s →</button> <span class="muted" style="font-size:15px">${data.length} Aufgaben pro Runde</span></div><div class="island" aria-hidden="true"><span>⛵</span></div></section><div class="row between section-title"><h2>Deine Lerninseln</h2><span class="muted">Du wählst deinen Weg.</span></div><div class="grid">${modules.map((m,i)=>`<button class="station" data-module="${i}"><span class="badge">${i+1} · ${m.range}</span><strong><span aria-hidden="true">${m.icon}</span> ${m.name}</strong><small>${m.sub}</small><small>${data.rounds[i]?'✓ '+data.rounds[i]+' Runden geschafft':'Hier kannst du üben'} →</small></button>`).join('')}</div><p class="foot">Ohne Stoppuhr · Mit Rechenhilfe · Pausen sind erlaubt</p>`);$('#start').onclick=()=>start(0);document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>start(+b.dataset.module))}
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function task(i){let a,b,op=data.mode==='minus'?'−':data.mode==='plus'?'+':Math.random()<.5?'+':'−';
if(i===0){a=rand(3,10);b=rand(0,a);return{kind:'split',a,b,answer:a-b}}
if(i===3){a=rand(10,100);let zehner=Math.random()<.5;return{kind:'place',a,b:zehner?Math.floor(a/10):a%10,answer:zehner?a%10:Math.floor(a/10),zehner}}
if(i===1){a=rand(1,19);b=op==='+'?rand(1,Math.min(10-a%10,20-a)):rand(1,a%10||10)}
if(i===2){a=op==='+'?rand(2,9):rand(11,18);b=op==='+'?rand(11-a,9):rand(a-9,9)}
if(i===4){a=rand(11,89);b=op==='+'?rand(1,Math.min(9-a%10,100-a)||1):rand(1,a%10||1);if(a%10===0&&op==='−')b=10;if(a%10===9&&op==='+')b=10;if(Math.random()<.4)b=10*rand(1,op==='+'?Math.floor((100-a)/10):Math.floor(a/10))}
if(i===5){a=op==='+'?rand(12,88):rand(21,98);if(a%10===0)a++;if(a%10===1&&op==='+')a++;if(a%10===9&&op==='−')a--;b=op==='+'?rand(11-a%10,9):rand(a%10+1,9)}
return{kind:'calc',a,b,op,answer:op==='+'?a+b:a-b}}
function start(i){state={i,n:0,first:0,help:0,attempts:0,done:false,usedHint:false,seen:new Set()};nextTask()}
function nextTask(){let t;for(let k=0;k<40;k++){t=task(state.i);if(!state.seen.has(JSON.stringify(t)))break}state.seen.add(JSON.stringify(t));state.t=t;state.attempts=0;state.usedHint=false;state.done=false;exercise()}
function prompt(t){if(t.kind==='split')return `Zerlege ${t.a}. Ein Teil ist ${t.b}. Wie groß ist der andere Teil?`;if(t.kind==='place')return t.zehner?`${t.a} sind ${t.b} Zehner und wie viele Einer?`:`${t.a} sind wie viele Zehner und ${t.b} Einer?`;return `Wie viel ist ${t.a} ${t.op==='+'?'plus':'minus'} ${t.b}?`}
function equation(t){const input='<input id="answer" class="answer" aria-label="Deine Antwort" inputmode="numeric" autocomplete="off" maxlength="3" pattern="[0-9]*">';if(t.kind==='split')return `${t.a} = ${t.b} + ${input}`;if(t.kind==='place')return t.zehner?`${t.a} = ${t.b} Z + ${input} E`:`${t.a} = ${input} Z + ${t.b} E`;return `${t.a} ${t.op} ${t.b} = ${input}`}
function exercise(){lastPage='exercise';mount(`<div class="row between"><button id="back" class="quiet">← Lerninseln</button><button id="pause">Ⅱ Pause</button></div><section class="panel exercise"><div class="row between"><span class="badge">${modules[state.i].name}</span><span class="muted">Aufgabe ${state.n+1} von ${data.length}</span></div><div class="steps"><span><b>1</b> Schauen</span><span><b>2</b> Rechnen</span><span><b>3</b> Prüfen</span></div><h2>${state.t.kind==='split'?'Welcher Teil fehlt?':state.t.kind==='place'?'Zehner und Einer':'Du kannst das in Ruhe lösen.'}</h2><button id="read" class="quiet">♬ Aufgabe vorlesen</button><div class="equation">${equation(state.t)}</div><div id="hint" class="hidden hint"></div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'C'].map(x=>`<button data-key="${x}" aria-label="${x==='⌫'?'Letzte Ziffer löschen':x==='C'?'Antwort löschen':x}">${x}</button>`).join('')}</div><div class="row" style="justify-content:center"><button id="help">Rechenhilfe</button><button id="check" class="primary">Prüfen ✓</button><button id="next" class="primary hidden">Weiter →</button></div><div id="feedback" class="feedback" role="status" aria-live="polite">Schau zuerst auf das Rechenzeichen.</div><div class="progress" style="justify-content:center" aria-label="${state.n} von ${data.length} Aufgaben geschafft">${Array.from({length:data.length},(_,i)=>`<i class="${i<state.n?'done':''}"></i>`).join('')}</div></section>`);
$('#back').onclick=home;$('#pause').onclick=pause;$('#read').onclick=()=>speak(prompt(state.t));$('#read').disabled=!('speechSynthesis'in window);$('#help').onclick=showHint;$('#check').onclick=check;$('#next').onclick=advance;$('#answer').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,3);$('#answer').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(state.done)advance();else check()}};document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(state.done)return;const a=$('#answer');a.value=b.dataset.key==='C'?'':b.dataset.key==='⌫'?a.value.slice(0,-1):(a.value+b.dataset.key).slice(0,3)});if(data.voice)speak(prompt(state.t))}
function dots(a,b,minus=false){let total=minus?a:a+b;return `<div class="frames" aria-hidden="true">${Array.from({length:Math.ceil(total/10)||1},(_,r)=>`<div class="ten">${Array.from({length:10},(_,c)=>{let n=r*10+c;return `<span class="dot ${n<total?(minus?(n<a-b?'a':'gone'):(n<a?'a':'b')):''}"></span>`}).join('')}</div>`).join('')}</div>`}
function helpText(t,reveal=false){if(t.kind==='split')return `${dots(t.b,t.a-t.b)}<p>${t.a} Punkte insgesamt. ${t.b} sind grün. Zähle die goldenen Punkte.</p>`;
if(t.kind==='place'){let z=Math.floor(t.a/10),e=t.a%10;return `<p>Z = Zehner · E = Einer<br>Ein grünes Bündel steht für 10.</p><div class="hundred" aria-hidden="true">${'<span class="rod">10</span>'.repeat(z)}${'<span class="unit">1</span>'.repeat(e)}</div><p>Zähle ${t.zehner?'die einzelnen goldenen Punkte':'die grünen Zehnerbündel'}.</p>`}
let plus=t.op==='+',cross=plus?t.a%10+t.b>10:t.b>t.a%10&&t.a%10>0;let text='';if(cross&&t.b<10){let step=plus?10-t.a%10:t.a%10,mid=plus?t.a+step:t.a-step; text=`Erst bis ${mid}: ${t.a} ${t.op} ${step} = ${mid}.<br>Von ${t.b} bleiben noch ${t.b-step}.<br>Dann: ${mid} ${t.op} ${t.b-step} = ?`}
else if(t.a>20){let z=Math.floor(t.b/10)*10,e=t.b%10,mid=plus?t.a+z:t.a-z;text=z?`Erst die Zehner: ${t.a} ${t.op} ${z} = ${e?mid:'?'}.`:`Die Zehner bleiben gleich. Rechne mit den Einern: ${t.a%10} ${t.op} ${t.b} = ?`;if(z&&e)text+=`<br>Dann die Einer: ${mid} ${t.op} ${e} = ?`}
else text=plus?'Zähle die grünen und goldenen Punkte zusammen.':'Starte mit allen Punkten. Die durchgestrichenen Punkte gehen weg. Zähle die grünen Punkte.';
return `${t.a<=20&&t.answer<=20?dots(t.a,t.b,!plus):''}<p>${text}</p>`}
function showHint(){state.usedHint=true;$('#hint').classList.remove('hidden');$('#hint').innerHTML=helpText(state.t);$('#help').textContent='Hilfe ist geöffnet'}
function check(){if(state.done)return;const raw=$('#answer').value;if(!raw){$('#feedback').textContent='Trage zuerst eine Zahl ein.';return}state.attempts++;if(+raw===state.t.answer){state.done=true;if(state.attempts===1&&!state.usedHint)state.first++;else state.help++;$('#feedback').textContent=state.usedHint?'Richtig! Du hast die Hilfe gut genutzt.':'Richtig! Gut gerechnet.';$('#answer').readOnly=true;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#next').focus();document.querySelectorAll('[data-key]').forEach(b=>b.disabled=true)}else{showHint();$('#feedback').textContent=state.attempts<2?'Noch nicht. Schau dir die Rechenhilfe an.':`Wir lösen es gemeinsam: Die gesuchte Zahl ist ${state.t.answer}. Trage sie ein.`;$('#answer').value='';$('#answer').focus()}}
function advance(){if(!state.done)return;state.n++;if(state.n>=data.length){data.rounds[state.i]++;save();finish()}else nextTask()}
function pause(){lastPage='pause';const v=$('#answer').value,h=state.usedHint;mount(`<section class="panel exercise"><div class="big-icon" aria-hidden="true">☀</div><div class="eyebrow">Deine Pause</div><h1>Einmal locker machen.</h1><p>Stell die Füße auf den Boden.<br>Strecke deine Arme.<br>Atme dreimal ruhig ein und aus.</p><p class="muted">Du entscheidest, wann es weitergeht.</p><button id="resume" class="primary">Ich bin bereit →</button><p><button id="leave" class="quiet">Für heute aufhören</button></p></section>`);$('#resume').onclick=()=>{exercise();$('#answer').value=v;if(h)showHint();if(state.done){$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#answer').readOnly=true;document.querySelectorAll('[data-key]').forEach(b=>b.disabled=true);$('#feedback').textContent='Diese Aufgabe hast du schon gelöst.'}};$('#leave').onclick=home}
function finish(){const i=state.i;lastPage='finish';mount(`<section class="panel exercise"><div class="big-icon" aria-hidden="true">⛵</div><div class="eyebrow">Runde geschafft</div><h1>Das war ein guter Schritt!</h1><p>Du hast ${data.length} Aufgaben gelöst.</p><p class="muted">${state.first} gleich selbst gelöst · ${state.help} mit Hilfe oder erneutem Versuch</p><div class="hint">Jetzt tut eine kleine Pause gut.<br>Steh auf und strecke dich.</div><div class="row" style="justify-content:center"><button id="end" class="primary">Fertig für heute</button><button id="again">Noch eine Runde</button></div><details><summary>Mein Aufmerksamkeits-Check</summary><p>Habe ich auf das Rechenzeichen geschaut?<br>Habe ich meine Antwort noch einmal geprüft?<br>Habe ich mir Hilfe oder eine Pause genommen?</p><p>Such dir für die nächste Runde einen dieser Schritte aus.</p></details></section>`);$('#end').onclick=home;$('#again').onclick=()=>start(i)}
function adults(){if(state&&state.n<data.length){if(lastPage==='exercise')pause();return}mount(`<section class="panel"><div class="eyebrow">Für Erwachsene</div><h1 style="font-size:35px">Gut dosiert üben.</h1><p>Starten Sie gemeinsam mit einer kurzen Runde. Danach kann das Kind die Aufgaben selbst bedienen. Alle Stationen sind frei wählbar.</p><div class="setting row between"><label for="length">Aufgaben pro Runde</label><select id="length"><option value="3">3 · sehr kurz</option><option value="5">5 · kurz</option><option value="8">8 · etwas länger</option></select></div><div class="setting row between"><label for="mode">Rechenart</label><select id="mode"><option value="mixed">Plus und Minus</option><option value="plus">Nur Plus</option><option value="minus">Nur Minus</option></select></div><div class="setting row between"><label for="voice">Aufgabe automatisch vorlesen</label><input type="checkbox" id="voice"></div><p class="foot">Vorlesen verwendet die Stimmen des Browsers und ist je nach Gerät auch offline verfügbar. Z = Zehner, E = Einer.</p><h2 style="font-size:22px">Ein möglicher Lernweg</h2><p>1. Zahlen bis 10 zerlegen.<br>2. Plus und Minus bis 20 festigen.<br>3. Über die 10 in zwei Schritten rechnen.<br>4. Zehner und Einer bis 100 verstehen.<br>5. Ohne, dann mit Zehnerübergang rechnen.</p><p>Die Rechenbrücken verwenden einstellige zweite Zahlen. Im Zahlenraum 100 kommen außerdem ganze Zehner vor. Lieber eine sichere Station wiederholen als zu früh weitergehen.</p><p>Die ruhige Oberfläche, kurzen Runden und Prüfschritte unterstützen aufmerksames Arbeiten. Das Programm ist ein Lernangebot, keine ADHS-Behandlung und kein diagnostischer Test.</p><p class="foot">Nur abgeschlossene Runden und Einstellungen werden in diesem Browser gespeichert, sofern der Browser dies zulässt. Keine Namen, keine Konten, keine Rangliste. ${storage?'':'Speicherung ist hier nicht verfügbar.'}</p><button id="close" class="primary">Speichern & zurück</button><details><summary>Lernstand zurücksetzen</summary><p>Dadurch werden die gespeicherten Rundenzähler gelöscht.</p><button id="reset">Rundenzähler löschen</button><span id="resetmsg" role="status"></span></details></section>`);$('#length').value=data.length;$('#mode').value=data.mode;$('#voice').checked=data.voice;$('#close').onclick=()=>{data.length=+$('#length').value;data.mode=$('#mode').value;data.voice=$('#voice').checked;save();home()};$('#reset').onclick=()=>{data.rounds=Array(6).fill(0);save();$('#resetmsg').textContent=' Gelöscht.'}}
$('#adult').onclick=adults;home();
</script></body></html>
